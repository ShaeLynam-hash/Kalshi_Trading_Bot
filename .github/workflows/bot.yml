name: Kalshi Arbitrage Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run arbitrage scan
        env:
          KALSHI_API_KEY_ID:      ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY_B64: ${{ secrets.KALSHI_PRIVATE_KEY_B64 }}
          MIN_EDGE:           '0.08'   # 8% edge — high conviction only
          MAX_TRADE_USDC:     '10'     # max $10 per trade
          MAX_OPEN_POSITIONS: '3'      # max 3 positions at a time
          MIN_BALANCE:        '20'     # stop trading below $20
          TAKE_PROFIT_PCT:    '0.50'   # sell at +50% gain
          STOP_LOSS_PCT:      '-999'   # let trades expire
          DRY_RUN:            'true'   # PAPER TRADE ONLY — set to false when ready
        run: python run_once.py
