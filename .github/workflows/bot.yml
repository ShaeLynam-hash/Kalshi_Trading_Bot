name: Kalshi Arbitrage Bot

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes, 24/7
  workflow_dispatch:         # manual trigger from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run arbitrage scan
        env:
          KALSHI_API_KEY_ID:      ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY_B64: ${{ secrets.KALSHI_PRIVATE_KEY_B64 }}
          MIN_EDGE:           '0.05'
          MAX_TRADE_USDC:     '10'
          MAX_OPEN_POSITIONS: '15'
          TAKE_PROFIT_PCT:    '0.40'
          STOP_LOSS_PCT:      '-0.40'
          DRY_RUN:            'false'
        run: python run_once.py
