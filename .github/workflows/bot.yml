name: Kalshi Arbitrage Bot

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes, 24/7
  workflow_dispatch:         # manual trigger from GitHub UI
  push:
    branches: [main]         # also runs on every code push

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run arbitrage scan
        env:
          KALSHI_API_KEY_ID:      ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY_B64: ${{ secrets.KALSHI_PRIVATE_KEY_B64 }}
          MIN_EDGE:           '0.08'   # 8% edge required — high conviction only
          MAX_TRADE_USDC:     '12'     # max $12 per trade
          MAX_OPEN_POSITIONS: '4'      # concentrated: 4 positions max
          TAKE_PROFIT_PCT:    '0.50'   # sell at +50% gain
          STOP_LOSS_PCT:      '-999'   # no stop loss — let trades expire
          DRY_RUN:            'false'
        run: python run_once.py
