name: Keep Bot Alive

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep scheduler alive
        run: |
          git config user.email "bot@kalshi-bot.com"
          git config user.name "Kalshi Bot"
          git commit --allow-empty -m "keepalive: $(date -u)"
          git push
